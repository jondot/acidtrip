name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --locked -p acidtrip --target ${{ matrix.target }}

      - name: Fetch appimagetool
        if: runner.os == 'Linux'
        run: |
          base=https://github.com/AppImage
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$base/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> $GITHUB_ENV
          arch=${TARGET%%-*}
          if [ "$arch" != x86_64 ]; then
            curl -fsSL -o "$RUNNER_TEMP/runtime-$arch" "$base/type2-runtime/releases/download/continuous/runtime-$arch"
            echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/runtime-$arch" >> $GITHUB_ENV
          fi
        env:
          TARGET: ${{ matrix.target }}

      # tar.gz (binary + desktop launcher), plus Acidtrip-<target>.zip on
      # macOS and acidtrip-<target>.AppImage on Linux.
      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: acidtrip-${{ matrix.target }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # needed for cosign keyless signing via OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        run: |
          # Keyless signing via GitHub OIDC: no static keys to manage.
          # Produces .sig (signature) and .crt (Fulcio-issued certificate)
          # alongside each archive, app zip and AppImage.
          find artifacts \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.AppImage' \) -print0 | while IFS= read -r -d '' f; do
            echo "Signing $f"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.crt" \
              "$f"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.sig
            artifacts/**/*.crt
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/jondot/acidtrip/main/install.sh | sh
            ```

            The installer also adds an app launcher: `Acidtrip.app` in `~/Applications` on macOS, a menu entry on Linux.

            Or download for your platform below:

            - **macOS app:** `Acidtrip-<target>.zip`, unzip and drag `Acidtrip.app` to Applications. It is not notarized: the first time, right-click it and choose Open (or run `xattr -dr com.apple.quarantine Acidtrip.app`).
            - **Linux app:** `acidtrip-<target>.AppImage`, `chmod +x` it and double-click.
            - **Command line:** `acidtrip-<target>.tar.gz`, unpack it and put `acidtrip` on your `PATH`.

            ## Verify a download

            Release artifacts are signed with [cosign](https://docs.sigstore.dev/cosign/overview) (keyless via GitHub OIDC). No static key to trust: the signature is bound to this workflow run.

            ```sh
            cosign verify-blob \
              --certificate-identity-regexp 'https://github.com/jondot/acidtrip/\.github/workflows/release\.yml' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate acidtrip-<target>.tar.gz.crt \
              --signature acidtrip-<target>.tar.gz.sig \
              acidtrip-<target>.tar.gz
            ```
