name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --locked -p acidtrip --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../acidtrip-${{ matrix.target }}.tar.gz acidtrip
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: acidtrip-${{ matrix.target }}
          path: acidtrip-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # needed for cosign keyless signing via OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        run: |
          # Keyless signing via GitHub OIDC: no static keys to manage.
          # Produces .sig (signature) and .crt (Fulcio-issued certificate)
          # alongside each .tar.gz.
          find artifacts -name '*.tar.gz' -print0 | while IFS= read -r -d '' f; do
            echo "Signing $f"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.crt" \
              "$f"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.sig
            artifacts/**/*.crt
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/jondot/acidtrip/main/install.sh | sh
            ```

            Or download the archive for your platform below, unpack it and put `acidtrip` on your `PATH`.

            ## Verify a download

            Release artifacts are signed with [cosign](https://docs.sigstore.dev/cosign/overview) (keyless via GitHub OIDC). No static key to trust: the signature is bound to this workflow run.

            ```sh
            cosign verify-blob \
              --certificate-identity-regexp 'https://github.com/jondot/acidtrip/\.github/workflows/release\.yml' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate acidtrip-<target>.tar.gz.crt \
              --signature acidtrip-<target>.tar.gz.sig \
              acidtrip-<target>.tar.gz
            ```
