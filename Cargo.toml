[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Dotan J. Nahum <jondotan@gmail.com>"]
repository = "https://github.com/jondot/acidtrip"

[workspace.dependencies]
acidtrip-core = { path = "crates/acidtrip-core" }
acidtrip-io = { path = "crates/acidtrip-io" }
acidtrip-ai = { path = "crates/acidtrip-ai" }
acidtrip-net = { path = "crates/acidtrip-net" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp", "bmp"] }
png = "0.18"
gif = "0.14"
unifont = "1"
line_drawing = "1"
zstd = "0.14"
blake3 = "1"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
insta = "1"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
