<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="acidtrip">
<title>{{ title }}</title>
{%- if author %}
<meta name="author" content="{{ author }}">
{%- endif %}
{%- if comments %}
<meta name="description" content="{{ comments }}">
{%- endif %}
<style>
{{ font_face }}
html, body { margin: 0; background: #000; }
body { display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 16px; box-sizing: border-box; }
.acid {
  margin: 0;
  color: {{ fg }};
  background: {{ bg }};
  font-family: {{ font_stack }};
  font-size: min(16px, calc((100vw - 32px) / {{ cols }} / 0.6));
  line-height: 1;
  letter-spacing: 0;
  font-variant-ligatures: none;
  white-space: pre;
}
{{ css }}</style>
</head>
<body>
<pre class="acid" aria-label="{{ title }}">{{ body }}</pre>
</body>
</html>
